name: Build, Publish and Deploy to MonsterASP.NET

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./WakeelAI

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore WakeelAI.slnx

      - name: Build
        run: dotnet build WakeelAI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WakeelAI.slnx --configuration Release --no-build

      - name: Publish API
        env:
          # appsettings.json is committed with EMPTY secret placeholders on purpose.
          # Real values are injected here and, at runtime, by the hosting environment.
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
          Jwt__SecretKey: ${{ secrets.JWT_SECRET_KEY }}
          AiNode__InternalApiKey: ${{ secrets.AI_INTERNAL_API_KEY }}
          Encryption__Key: ${{ secrets.ENCRYPTION_KEY }}
          Smtp__User: ${{ secrets.SMTP_USER }}
          Smtp__Pass: ${{ secrets.SMTP_PASS }}
          Smtp__From: ${{ secrets.SMTP_FROM }}
        run: |
          dotnet publish ./Wakeel.API/Wakeel.API.csproj `
            --configuration Release `
            --no-build `
            --output ../publish

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Apply database migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
          Jwt__SecretKey: ${{ secrets.JWT_SECRET_KEY }}
          AiNode__InternalApiKey: ${{ secrets.AI_INTERNAL_API_KEY }}
          Encryption__Key: ${{ secrets.ENCRYPTION_KEY }}
        run: dotnet ef database update --project Wakeel.Infrastructure/Wakeel.Infrastructure.csproj --startup-project Wakeel.API/Wakeel.API.csproj

      - name: Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: publish